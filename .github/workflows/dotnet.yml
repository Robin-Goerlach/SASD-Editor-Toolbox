name: dotnet

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    # V1 must remain usable from both Linux and Windows terminals.
    # Run the *same* headless solution tests on both runner families so
    # OS-dependent console key models, Unicode globalization behavior,
    # path handling and sample compilation cannot silently drift.
    #
    # This is deliberately NOT described as interactive terminal smoke:
    # GitHub's hosted runners have no real human-operated console window
    # or terminal font/cell-width configuration. Manual PTY/Windows Terminal
    # release checks remain in docs/*/TERMINAL*-V1-*.md.
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Sasd.Editor.Toolbox.slnx
      - name: Build
        run: dotnet build Sasd.Editor.Toolbox.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Sasd.Editor.Toolbox.slnx --configuration Release --no-build
      # The FIRST-ED reference application's help must work *without* an
      # interactive terminal: GitHub Actions supplies redirected streams.
      # This is an executable consumer entry-point check on both Windows
      # and Linux. The guided --demo still needs a real human-operated
      # terminal for visual/key-delivery sign-off.
      - name: Developer demo CLI help smoke
        run: dotnet run --project samples/dotnet/Sasd.Editor.FirstEd.Sample --configuration Release --no-build -- --help
      # RC-03 must run, not merely compile: this standalone application
      # references only Sasd.Editor.Core and checks insert/find/undo/export.
      - name: Independent public Core consumer smoke
        run: dotnet run --project samples/dotnet/Sasd.Editor.Consumer.Sample --configuration Release --no-build
      # Validate package production on BOTH operating systems without
      # publishing anything. An explicit prerelease version prevents this
      # CI artifact from being mistaken for an approved V1.0 release.
      - name: Build Core prerelease NuGet package
        run: dotnet pack src/dotnet/Sasd.Editor.Core/Sasd.Editor.Core.csproj --configuration Release --no-build --output ./artifacts/rc-package -p:PackageVersion=1.0.0-rc.1
      - name: Check expected package artifact
        shell: pwsh
        run: |
          $expected = 'artifacts/rc-package/Sasd.Editor.Core.1.0.0-rc.1.nupkg'
          if (-not (Test-Path -LiteralPath $expected -PathType Leaf)) {
            throw "RC package is missing: $expected"
          }
          Write-Output "RC package produced: $expected"
      # Inspect the actual ZIP-based NuGet artifact. Successful packing alone
      # does not prove that license, version, repository and the offline README
      # reached the manifest/content visible to an external package consumer.
      # pwsh runs unchanged on both hosted runner operating systems.
      - name: Validate Core package manifest and README
        shell: pwsh
        run: |
          $package = 'artifacts/rc-package/Sasd.Editor.Core.1.0.0-rc.1.nupkg'
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $package).Path)
          try {
            $manifestEntry = $archive.Entries | Where-Object { $_.FullName -eq 'Sasd.Editor.Core.nuspec' } | Select-Object -First 1
            $readmeEntry = $archive.Entries | Where-Object { $_.FullName -eq 'README.md' } | Select-Object -First 1
            # A valid nuspec and README are not sufficient for a usable
            # library package. Assert that NuGet carries the actual Core
            # assembly at the TFM path expected by external .NET 10 hosts.
            # This also guards against accidentally packing only sources
            # or the terminal sample instead of the UI-neutral Core.
            $coreAssembly = $archive.Entries | Where-Object {
              $_.FullName -eq 'lib/net10.0/Sasd.Editor.Core.dll'
            } | Select-Object -First 1
            if ($null -eq $coreAssembly -or $coreAssembly.Length -le 0) {
              throw 'Core NuGet package lacks a nonempty net10.0 Core assembly'
            }
            if ($null -eq $manifestEntry -or $null -eq $readmeEntry) {
              throw 'Core NuGet package must contain its nuspec and root README.md'
            }
            $reader = [System.IO.StreamReader]::new($manifestEntry.Open())
            try {
              [xml]$manifest = $reader.ReadToEnd()
            } finally {
              $reader.Dispose()
            }
            $metadata = $manifest.package.metadata
            $checks = @{
              'id' = @($metadata.id, 'Sasd.Editor.Core')
              'version' = @($metadata.version, '1.0.0-rc.1')
              'authors' = @($metadata.authors, 'SASD-GmbH')
              'license' = @($metadata.license.InnerText, 'MIT')
              'readme' = @($metadata.readme, 'README.md')
              'repository' = @($metadata.repository.url, 'https://github.com/Robin-Goerlach/SASD-Editor-Toolbox')
            }
            foreach ($name in $checks.Keys) {
              $actual, $expected = $checks[$name]
              if ([string]$actual -cne $expected) {
                throw "Invalid NuGet $name : expected '$expected', found '$actual'"
              }
            }
            if ($metadata.license.type -ne 'expression') {
              throw 'Expected SPDX expression for NuGet package license'
            }
            Write-Output 'Core RC NuGet manifest and embedded README: PASS'
          } finally {
            $archive.Dispose()
          }
      # An external project must restore the assembled NuGet artifact rather
      # than accidentally compile against Core's source ProjectReference.
      # Keep this consumer out of the normal solution: restore happens only
      # AFTER the RC package has been built on this runner.
      # NuGet's global package cache can retain an older artifact with the
      # same provisional version. Isolate the package folder for BOTH restore
      # and execution, so this check cannot silently reuse a prior package.
      # This is different from --no-cache, which alone does not guarantee an
      # empty global-packages directory.
      - name: Restore independent NuGet package consumer
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/sasd-editor-rc-packages
        run: dotnet restore samples/dotnet/Sasd.Editor.PackageConsumer.Sample/Sasd.Editor.PackageConsumer.Sample.csproj --source ./artifacts/rc-package
      - name: Run independent NuGet package consumer
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/sasd-editor-rc-packages
        run: dotnet run --project samples/dotnet/Sasd.Editor.PackageConsumer.Sample --configuration Release --no-restore
      # Record a cryptographic fingerprint of the exact package bytes
      # consumed and uploaded by this operating-system-specific job.
      # SHA-256 is an integrity identifier, NOT a signature or release
      # authorization. We calculate it after the package consumer completes.
      - name: Record RC NuGet package SHA-256
        shell: pwsh
        run: |
          $package = 'artifacts/rc-package/Sasd.Editor.Core.1.0.0-rc.1.nupkg'
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $sidecar = "$package.sha256"
          "$hash  Sasd.Editor.Core.1.0.0-rc.1.nupkg" | Set-Content -LiteralPath $sidecar -Encoding ascii
          Write-Output "Verified RC package SHA-256: $hash"
      # Read the generated sidecar from disk to verify that it matches the
      # package bytes after integration tests. This does not sign the artifact.
      - name: Verify RC package checksum sidecar
        shell: pwsh
        run: |
          $package = 'artifacts/rc-package/Sasd.Editor.Core.1.0.0-rc.1.nupkg'
          $record = (Get-Content -LiteralPath "$package.sha256" -Raw).Trim()
          $parts = $record.Split(@('  '), 2, [System.StringSplitOptions]::None)
          if ($parts.Count -ne 2 -or $parts[1] -cne 'Sasd.Editor.Core.1.0.0-rc.1.nupkg' -or $parts[0].Length -ne 64) {
            throw "Malformed RC checksum sidecar: $record"
          }
          $actual = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash
          if ($actual -ine $parts[0]) { throw 'RC package checksum mismatch' }
          Write-Output "RC checksum readback: PASS ($actual)"
      # Bind each evaluated package to its exact source commit and runner.
      # This machine-readable provenance is evidence for a human reviewer;
      # it is NOT a signed attestation or a publication authorization.
      - name: Record RC build provenance
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUNNER_OS: ${{ matrix.os }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $package = 'artifacts/rc-package/Sasd.Editor.Core.1.0.0-rc.1.nupkg'
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $evidence = @(
            "source_sha=$env:SOURCE_SHA"
            "runner_os=$env:RUNNER_OS"
            "workflow_run=$env:RUN_URL"
            "package_file=Sasd.Editor.Core.1.0.0-rc.1.nupkg"
            "sha256=$hash"
          )
          $evidence | Set-Content -LiteralPath 'artifacts/rc-package/rc-build-evidence.txt' -Encoding utf8
          Write-Output "RC evidence recorded for $env:SOURCE_SHA on $env:RUNNER_OS"
      # Keep the inspected test package available for reviewers. Artifact names
      # include the runner OS to avoid collisions between matrix jobs.
      # Publishing a CI artifact is NOT publishing to NuGet or approving V1.0.
      - name: Upload verified RC package for manual integration tests
        uses: actions/upload-artifact@v4
        with:
          name: editor-core-rc-package-${{ matrix.os }}
          path: |
            artifacts/rc-package/Sasd.Editor.Core.1.0.0-rc.1.nupkg
            artifacts/rc-package/Sasd.Editor.Core.1.0.0-rc.1.nupkg.sha256
            artifacts/rc-package/rc-build-evidence.txt
          if-no-files-found: error
          retention-days: 14
