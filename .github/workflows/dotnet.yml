name: dotnet

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Sasd.Editor.Toolbox.slnx
      - name: Build
        run: dotnet build Sasd.Editor.Toolbox.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Sasd.Editor.Toolbox.slnx --configuration Release --no-build
